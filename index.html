<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Andrew XU 的个人网站。从投行与科研，到中国企业出海一线。">
  <meta name="theme-color" content="#f7f5ef">
  <title>Andrew XU · 航行手记</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="content.js"></script>
  <script defer src="site.js"></script>
</head>
<body id="home">
  <a class="skip" href="#main" data-copy="skip">跳到正文</a>
  <header class="site-header">
    <div class="frame header-inner">
      <a class="wordmark" href="#home"><span class="compass" aria-hidden="true">✦</span> Andrew XU</a>
      <nav aria-label="站内导航" id="navigation"></nav>
      <div class="languages" role="group" aria-label="语言 / Language">
        <button type="button" data-lang="zh" lang="zh-CN" aria-pressed="true">中文</button>
        <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>
  <main id="main">
    <section class="frame hero" aria-labelledby="hello">
      <div class="hero-text">
        <p class="kicker"><span></span><span data-copy="label"></span></p>
        <h1 id="hello"><span data-copy="greeting"></span><br><em lang="en" data-copy="heroName"></em></h1>
        <p class="hero-summary" data-copy="summary"></p>
        <a class="primary-link" href="#experience" data-copy="journeyTitle"></a>
      </div>
      <figure class="cover">
        <img src="voyage.webp" alt="" width="1440" height="960" fetchpriority="high">
        <figcaption><span aria-hidden="true">✦</span><span data-copy="photoCaption"></span></figcaption>
      </figure>
    </section>
    <section id="experience" class="journey" aria-labelledby="voyage-title">
      <div class="frame journal">
        <div class="journal-heading">
          <h2 id="voyage-title" data-copy="journeyTitle"></h2>
          <p data-copy="journeyIntro"></p>
        </div>
        <div id="chapters"></div>
      </div>
    </section>
    <div class="frame templates" id="templates"></div>
  </main>
  <footer>
    <div class="frame footer-inner">
      <a class="wordmark" href="#home"><span class="compass" aria-hidden="true">✦</span> Andrew XU</a>
      <a href="#home" data-copy="top"></a>
    </div>
  </footer>
</body>
</html>
